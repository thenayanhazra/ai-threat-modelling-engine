# Fictional payments platform used for the sample report in the README.
# Contains deliberate weaknesses: a public admin console running as root,
# and secrets reachable from internet-facing workloads.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: public-gateway
  namespace: payments
spec:
  rules:
    - host: pay.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: checkout-api
                port:
                  number: 443
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-api
  namespace: payments
spec:
  selector:
    app: checkout-api
  ports:
    - port: 443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: payments
spec:
  selector:
    matchLabels:
      app: checkout-api
  template:
    metadata:
      labels:
        app: checkout-api
    spec:
      containers:
        - name: api
          image: registry.example.com/checkout-api:2.4.1
          envFrom:
            - secretRef:
                name: card-processor-keys
---
apiVersion: v1
kind: Service
metadata:
  name: admin-console
  namespace: payments
spec:
  type: LoadBalancer
  selector:
    app: admin-console
  ports:
    - port: 8443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-console
  namespace: payments
spec:
  selector:
    matchLabels:
      app: admin-console
  template:
    metadata:
      labels:
        app: admin-console
    spec:
      containers:
        - name: console
          image: registry.example.com/admin-console:1.9.0
          securityContext:
            runAsUser: 0
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ledger-db-credentials
                  key: password
      volumes:
        - name: ledger
          persistentVolumeClaim:
            claimName: ledger-data
---
apiVersion: v1
kind: Secret
metadata:
  name: card-processor-keys
  namespace: payments
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: ledger-db-credentials
  namespace: payments
type: Opaque
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ledger-data
  namespace: payments
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 50Gi
